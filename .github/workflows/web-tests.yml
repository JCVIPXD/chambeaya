name: Web interface tests

on:
  push:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-tests.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm exec --workspace=@chambeaya/web -- playwright install --with-deps chromium
      - run: npm run test:web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: web-test-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  api-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chambeaya
          POSTGRES_PASSWORD: chambeaya_test
          POSTGRES_DB: chambeaya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chambeaya -d chambeaya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHAMBEAYA_INTEGRATION_TESTS: 'true'
      DATABASE_URL: postgresql://chambeaya:chambeaya_test@127.0.0.1:5432/chambeaya_test?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm exec --workspace=@chambeaya/api -- prisma migrate deploy
      - run: npm run test:integration --workspace=@chambeaya/api
