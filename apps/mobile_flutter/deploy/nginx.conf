# Sirve la app Flutter compilada (build/web) dentro del contenedor
# `worker-app`. Nginx del host hace proxy_pass hacia este contenedor; este
# archivo NO se instala en el host (ver deploy/nginx/chambeaya.conf.template).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # index.html, el service worker y version.json deciden si el navegador
  # descarga una versión nueva de la app: sin caché para que una actualización
  # se note al recargar en vez de quedar servida desde una copia vieja.
  location = /index.html {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /version.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Todo lo demás (main.dart.js, flutter.js, flutter_bootstrap.js,
  # assets/AssetManifest.bin, assets/NOTICES, assets/fonts/*.otf,
  # canvaskit/*, y cualquier archivo nuevo que agregue una versión futura de
  # Flutter) y el fallback de SPA para rutas profundas (p. ej. /jobs/123).
  # `flutter build web` no le pone hash al nombre de ninguno de estos
  # archivos (ALTO-4/BAJO-N4 de CN-20260925-002/004): enumerar extensiones
  # una por una (como se hacía antes) se queda corto en cuanto Flutter agrega
  # un tipo de archivo nuevo — así se nos escaparon `.otf`, `AssetManifest.bin`
  # y `NOTICES` (sin extensión) la primera vez. En su lugar, todo lo que no
  # matchee alguna de las 3 ubicaciones de arriba cae aquí con `no-cache`: el
  # navegador guarda una copia pero SIEMPRE revalida con el servidor
  # (`If-None-Match`/ETag, que Nginx ya calcula para archivos estáticos) antes
  # de usarla, así que una actualización se nota en la siguiente carga sin
  # perder el beneficio de no volver a descargar bytes que no cambiaron.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
